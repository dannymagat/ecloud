# /etc/fail2ban/filter.d/ecloud-portal.conf  (DRAFT, NOT APPLIED)
# Matches apps/portal/src/index.ts rejection events, e.g.
#   {"level":"warn","time":"2026-10-09T06:00:00.000Z",...,"event":"portal_auth_failed","ip":"198.51.100.9","flow_id":"..."}
# `portal_auth_rate_limited` is deliberately NOT matched: it is the app's own lockout answer and
# counting it would double-count the same attempts.
[Definition]
failregex = "event":"portal_auth_failed","ip":"<ADDR>"
ignoreregex =
datepattern = "time":"%%Y-%%m-%%dT%%H:%%M:%%S
