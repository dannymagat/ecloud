# /etc/fail2ban/filter.d/ecloud-admin.conf  (DRAFT, NOT APPLIED)
# Matches the JSON log lines of apps/api/src/security-events.ts, e.g.
#   {"level":"warn","time":"2026-10-09T06:00:00.000Z",...,"event":"admin_login_failed","ip":"203.0.113.7","request_id":"..."}
# With backend=systemd the journal timestamp is used; datepattern serves fail2ban-regex tests.
[Definition]
failregex = "event":"admin_(?:login|mfa|invitation)_failed","ip":"<ADDR>"
ignoreregex =
datepattern = "time":"%%Y-%%m-%%dT%%H:%%M:%%S
