# /etc/systemd/system/docker.service.d/10-ecloud-wg0.conf  (DRAFT, NOT APPLIED; VPS-WG-3)
#
# F-P10R-3: the freeradius container publishes 100.100.0.1:1812-1813/udp, an address that only
# exists once systemd-networkd has configured wg0. If Docker starts first after a reboot, the
# publish cannot bind and the container fails to start. Order Docker after wg0 is configured.
#
# - `Wants=` (not `Requires=`): if wg0 is broken, Docker (and q-mira.com) still start after the
#   wait-online timeout; only the RADIUS publish is affected.
# - wg0 has no carrier semantics; `:no-carrier` is the lowest state that means "networkd has
#   configured the link". Verify on the host with `networkctl status wg0` before relying on it
#   (REQUIRES_HOST_TEST): if the unit never becomes ready, boot is delayed by --timeout only.
# Apply: install, `systemctl daemon-reload` (no Docker restart needed until the next boot).
[Unit]
Wants=systemd-networkd-wait-online@wg0:no-carrier.service
After=systemd-networkd-wait-online@wg0:no-carrier.service
