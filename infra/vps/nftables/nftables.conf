#!/usr/sbin/nft -f
# /etc/nftables.conf for vps (DRAFT, NOT APPLIED).
#
# Replaces Ubuntu's stock file, whose first line is `flush ruleset`: with Docker on the host,
# `systemctl reload|restart nftables` would then wipe Docker's iptables-nft NAT/FORWARD rules and
# cut every published container (q-mira.com's 127.0.0.1:8088 included) until Docker restarts.
# This file only includes self-contained, idempotent table files (they replace their own table).
include "/etc/nftables.d/*.nft"
