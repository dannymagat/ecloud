# /etc/ssh/sshd_config.d/10-ecloud-hardening.conf  (DRAFT, NOT APPLIED)
# SECURITY_ARCHITECTURE.md §2.2 (fixes F-38/F-39), D-024. Ubuntu 24.04 includes
# sshd_config.d/*.conf at the TOP of sshd_config and sshd uses the first value it reads, so this
# file (10-) wins over the stock file and over 50-cloud-init.conf.
# Apply only with infra/vps/scripts/apply-sshd.sh (sshd -t + dead-man rollback).

PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PermitEmptyPasswords no

# The only shell account today is `ubuntu` (REMOTE_ENVIRONMENT.md §5). When the dedicated
# deployment identity of D-024 is created, append it here in the same change.
AllowUsers ubuntu

X11Forwarding no
AllowAgentForwarding no
# VS Code Remote-SSH (used by the operator, REMOTE_ENVIRONMENT.md §3) needs local forwarding.
AllowTcpForwarding local
PermitTunnel no
GatewayPorts no

MaxAuthTries 3
LoginGraceTime 30
MaxStartups 10:30:60
ClientAliveInterval 300
ClientAliveCountMax 2
LogLevel VERBOSE
