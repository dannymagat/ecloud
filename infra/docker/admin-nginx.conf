# ECLOUD admin SPA -- LOCAL TESTING ONLY. This file is never used in production:
# production serves apps/admin/dist from the native Caddy edge (D-030, DEPLOYMENT_ARCHITECTURE.md §3).
# Serves the Vite build with an SPA fallback and proxies same-origin /api/ to the `api`
# Compose service, mirroring the production shape (D-029: SPA calls same-origin /api/v1).
server {
    listen 8080;
    server_name _;
    root /usr/share/ecloud-admin;
    server_tokens off;

    # Security headers. NOTE: nginx drops server-level add_header directives in any location
    # that declares its own add_header, so no location below uses add_header.
    # CSP matches the Vite build: one external module script + one stylesheet, self-hosted
    # woff2 fonts, the MFA QR code rendered as a data: image, same-origin /api fetches.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Never serve dotfiles (.env, .git, ...), even if one were copied into the web root.
    location ~ /\. {
        return 404;
    }

    # Container liveness (the admin image has no backend of its own).
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Lazy DNS resolution through Docker's embedded resolver, so nginx starts even when the
    # api container is absent (then /api/ answers 502).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ecloud_api http://api:3000;
        proxy_pass $ecloud_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (do not append to) any client-supplied X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets: long-lived cache; missing files are real 404s (no SPA fallback).
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Everything else falls back to index.html (client-side routing), never cached.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
