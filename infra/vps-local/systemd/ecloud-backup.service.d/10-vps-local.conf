# DRAFT, NOT APPLIED (docs/VPS_LOCAL_CHANGE_LIST.md LCL-BK-2)
# -> /etc/systemd/system/ecloud-backup.service.d/10-vps-local.conf
# scripts/backup/systemd/ecloud-backup.service is reused unchanged; on vps-local the backup sets
# live on /data (200 GB) and age is the static binary in /usr/local/bin (LCL-BK-1).
[Service]
# Empty assignment resets the base unit's list (/var/backups/ecloud does not exist here, and a
# missing ReadWritePaths entry without '-' makes ProtectSystem=strict namespacing fail).
ReadWritePaths=
ReadWritePaths=/data/ecloud-backups
ReadWritePaths=-/var/lib/node_exporter/textfile
Environment=AGE_BIN=/usr/local/bin/age
