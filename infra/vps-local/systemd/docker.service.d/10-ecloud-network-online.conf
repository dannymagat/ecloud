# DRAFT, NOT APPLIED (docs/VPS_LOCAL_CHANGE_LIST.md LCL-DOCKER-4)
# -> /etc/systemd/system/docker.service.d/10-ecloud-network-online.conf
# The edge and freeradius publish on 192.168.203.196 (bond1, DHCP). A Docker publish on a
# specific address fails if that address is not configured yet when dockerd starts the
# containers, so Docker waits for NetworkManager to report the network online. `Wants=` (not
# `Requires=`) keeps Docker starting even if the wait times out. Requires
# NetworkManager-wait-online.service to be enabled (check: systemctl is-enabled ...).
[Unit]
Wants=network-online.target NetworkManager-wait-online.service
After=network-online.target NetworkManager-wait-online.service
