# ECLOUD LAN edge (DRAFT, NOT APPLIED; docs/VPS_LOCAL_CHANGE_LIST.md LCL-APP-4)
#
# Mounted read-only as /etc/nginx/conf.d in the `edge` container (ecloud-admin image,
# nginx-unprivileged, uid 101). Replaces what Caddy did on the old VPS (VPS-CADDY-1):
#   8443  https  admin SPA (/usr/share/ecloud-admin) + same-origin /api/* -> api:3000
#   8444  https  captive portal -> portal:3002
#   8081  http   container-local liveness only (127.0.0.1 inside the container, not published)
# On every public server: security headers, /readyz /metrics /internal -> 404, no dotfiles,
# access log without query strings (portal URLs carry MAC / NAS id / UAM challenge).
# Client IP: LAN clients reach the edge through Docker's DNAT (source address preserved), so
# $remote_addr is the real client. The edge OVERWRITES X-Forwarded-For with it; the apps run
# with TRUST_PROXY_HOPS=1 / PORTAL_TRUST_PROXY_HOPS=1 (the edge is their only proxy hop).
# snippets/*.conf are included below; nginx loads only conf.d/*.conf (not subdirectories) by itself.

server_tokens off;
client_max_body_size 2m; # api public body limit is 1mb (apps/api/src/app.ts); api answers 413 itself

ssl_certificate /run/secrets/edge_tls_crt;
ssl_certificate_key /run/secrets/edge_tls_key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:ecloud_tls:5m;
ssl_session_timeout 1h;
ssl_session_tickets off;

# Default security headers, added only when the upstream did not set its own (the apps set CSP
# and, over HTTPS, HSTS). An empty value means nginx does not emit the header.
map $upstream_http_strict_transport_security $ecloud_hsts {
    '' 'max-age=31536000';
    default '';
}
map $upstream_http_x_content_type_options $ecloud_nosniff {
    '' 'nosniff';
    default '';
}
map $upstream_http_x_frame_options $ecloud_xfo {
    '' 'DENY';
    default '';
}
map $upstream_http_cross_origin_opener_policy $ecloud_coop {
    '' 'same-origin';
    default '';
}
map $upstream_http_permissions_policy $ecloud_permissions {
    '' 'camera=(), microphone=(), geolocation=()';
    default '';
}

# Cookies ignore ports: a browser that holds the admin session cookie (__Host-ecloud_sid, set by
# :8443) also sends it to :8444. The portal only ever gets its own flow cookie (__Host-pf).
map $http_cookie $ecloud_portal_cookie {
    default '';
    '~(?:^|;\s*)(?<ecloud_pf>__Host-pf=[^;]*)' $ecloud_pf;
}

log_format ecloud_edge '$remote_addr [$time_local] $server_port "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent $request_time "$http_user_agent"';

# Embedded Docker DNS, resolved lazily so the edge starts even if api/portal are absent (502).
resolver 127.0.0.11 valid=10s ipv6=off;

# ---- 8443: admin SPA + same-origin API --------------------------------------------------------
server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;
    root /usr/share/ecloud-admin;
    access_log /dev/stdout ecloud_edge;
    # Plain HTTP sent to the TLS port -> redirect to HTTPS. Fixed target (never the client's Host
    # header): the LAN address is also pinned in the certificate and the app origins (LCL-PRE-5).
    error_page 497 =301 https://192.168.203.196:8443$request_uri;

    include /etc/nginx/conf.d/snippets/ecloud-headers.conf;
    # Matches the Vite build (admin-nginx.conf / old Caddy site): one module script, one
    # stylesheet, self-hosted fonts, MFA QR code as data: image, same-origin fetches.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "same-origin" always;

    include /etc/nginx/conf.d/snippets/ecloud-private.conf;

    # api liveness (public /healthz of the api; /readyz stays private).
    location = /healthz {
        set $ecloud_api http://api:3000;
        proxy_pass $ecloud_api;
        include /etc/nginx/conf.d/snippets/ecloud-proxy.conf;
    }

    # Same-origin API for the SPA (D-029): session cookie + CSRF/Origin checks live in the api.
    location /api/ {
        set $ecloud_api http://api:3000;
        proxy_pass $ecloud_api;
        include /etc/nginx/conf.d/snippets/ecloud-proxy.conf;
    }

    # Hashed build assets: long-lived cache; a missing file is a real 404 (no SPA fallback).
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Client-side routing: everything else falls back to index.html, never cached.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}

# ---- 8444: captive portal ---------------------------------------------------------------------
server {
    listen 8444 ssl default_server;
    http2 on;
    server_name _;
    access_log /dev/stdout ecloud_edge;
    error_page 497 =301 https://192.168.203.196:8444$request_uri;

    include /etc/nginx/conf.d/snippets/ecloud-headers.conf;
    include /etc/nginx/conf.d/snippets/ecloud-private.conf;

    location / {
        set $ecloud_portal http://portal:3002;
        proxy_pass $ecloud_portal;
        include /etc/nginx/conf.d/snippets/ecloud-proxy.conf;
        # Allow-list: only the portal's own cookie reaches the portal (overrides the include).
        proxy_set_header Cookie $ecloud_portal_cookie;
    }
}

# ---- container-local liveness (Compose healthcheck) -------------------------------------------
server {
    listen 127.0.0.1:8081;
    server_name _;
    access_log off;
    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
    location / {
        return 404;
    }
}
