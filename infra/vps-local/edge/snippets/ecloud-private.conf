# Never reachable from the LAN: readiness detail, Prometheus metrics, internal API, dotfiles.
# Exact and ^~ prefix matches win over the regex and plain prefix locations of the server.
location = /readyz {
    return 404;
}
location = /metrics {
    return 404;
}
location ^~ /metrics/ {
    return 404;
}
location = /internal {
    return 404;
}
location ^~ /internal/ {
    return 404;
}
location ~ /\. {
    return 404;
}
