# Server-level security headers for every public edge server (included by ecloud-edge.conf).
# nginx drops inherited add_header directives in any location that declares its own, so no
# location in ecloud-edge.conf uses add_header.
# HSTS is sent for completeness; browsers ignore it for IP-address hosts (RFC 6797 §8.1.1).
add_header Strict-Transport-Security $ecloud_hsts always;
add_header X-Content-Type-Options $ecloud_nosniff always;
add_header X-Frame-Options $ecloud_xfo always;
add_header Cross-Origin-Opener-Policy $ecloud_coop always;
add_header Permissions-Policy $ecloud_permissions always;
