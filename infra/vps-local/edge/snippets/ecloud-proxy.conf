# Upstream request headers (included inside proxy locations of ecloud-edge.conf).
proxy_http_version 1.1;
proxy_set_header Connection '';
# Host with the port (192.168.203.196:8443), as the browser sent it.
proxy_set_header Host $http_host;
# OVERWRITE (never append) so a client-supplied X-Forwarded-For is discarded: the apps trust
# exactly one hop (TRUST_PROXY_HOPS=1) and read the LAN client address from here.
proxy_set_header X-Forwarded-For $remote_addr;
# TLS ends here; the apps need https for Secure / __Host- cookies (Express req.secure).
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host '';
proxy_set_header Forwarded '';
proxy_hide_header X-Powered-By;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
