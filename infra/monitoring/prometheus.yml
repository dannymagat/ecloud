# DRAFT (not applied; D-031 VPS change list). Prometheus scrape config for the ECLOUD pilot.
# DEPLOYMENT_ARCHITECTURE.md §6 defers Prometheus (+~400-600 MiB) until memory allows; the
# targets below are what it would scrape. All endpoints are loopback / compose-network only and
# never routed through Caddy:
#   api     GET /metrics on the INTERNAL listener (:3001)
#   worker  GET /metrics on the health listener (:3003, WORKER_HEALTH_HOST)
#   portal  GET /metrics on the separate metrics listener (PORTAL_METRICS_PORT, e.g. :3005)
#   node_exporter 127.0.0.1:9100 (host; textfile collector for backup + wg handshakes)
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/ecloud-alerts.yml

scrape_configs:
  - job_name: ecloud-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:3001']
  - job_name: ecloud-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['worker:3003']
  - job_name: ecloud-portal
    metrics_path: /metrics
    static_configs:
      - targets: ['portal:3005']
  - job_name: node
    static_configs:
      - targets: ['host.docker.internal:9100']
