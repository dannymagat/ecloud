#
#  ECLOUD Meraki cloud RADIUS listeners -- NOTHING IS DEFINED HERE.
#
#  Multi-vendor Cycle E (DECISIONS.md D-044, SECURITY_ARCHITECTURE.md §3.5).
#  Cisco Meraki sends splash sign-on RADIUS from the Meraki Cloud (shared
#  public addresses), so each Meraki NAS gets its OWN auth/acct listener
#  pair whose private client list carries that NAS's secret and shortname.
#
#  The listeners are rendered by `node apps/api/dist/radius-clients-cli.js`
#  into MERAKI_RADIUS_FILE (default ecloud-meraki.conf) and mounted
#  read-only OVER this directory. They exist only while the platform flag
#  MERAKI_CLOUD_RADIUS_ENABLED=true (default false) AND the Meraki source
#  ranges and a listener port range are configured; otherwise the rendered
#  file is a comment like this one. The LAN-only pilot (D-043) does not
#  expose RADIUS publicly, so this directory stays empty there.
#
######################################################################
