# -*- text -*-
######################################################################
#
#  ECLOUD clients.conf -- RENDERED TEMPLATE, DEV CONTENT ONLY.
#
#  Production: the ECLOUD worker ("raddb-renderer", AAA_ARCHITECTURE.md §3/§9)
#  renders one `client` block per `nas_clients` row (secret decrypted at render
#  time) into a 0600 file that is mounted read-only OVER this path. Nothing in
#  this file is used in production and no real secret ever appears here.
#
#  Dev stack (infra/compose/docker-compose.dev.yml): a single client covering
#  the Docker network the compose stack runs on. Packets from the developer
#  host arrive through the published 127.0.0.1:1812/1813 ports with the
#  Docker bridge gateway as source address, so they match this CIDR too.
#  Values come from the container environment ($ENV{...}, radiusd.conf
#  "ENVIRONMENT VARIABLES"); the entrypoint refuses to start when unset.
#
#  BlastRADIUS (CVE-2024-3596, AAA_ARCHITECTURE.md §8): the global defaults
#  in radiusd.conf are already `require_message_authenticator = yes` and
#  `limit_proxy_state = auto`; they are repeated per client on purpose so a
#  rendered production file carries the per-NAS value explicitly
#  (`nas_clients.require_message_authenticator`).
#
######################################################################

client ecloud_dev {
	ipaddr		= $ENV{RADIUS_DEV_CLIENT_CIDR}
	secret		= $ENV{RADIUS_DEV_CLIENT_SECRET}
	shortname	= ecloud-dev
	nas_type	= other

	require_message_authenticator = yes
	limit_proxy_state = auto
}
