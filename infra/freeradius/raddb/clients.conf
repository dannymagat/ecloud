# -*- text -*-
######################################################################
#
#  EZECLOUD clients.conf -- NO CLIENT IS DEFINED HERE.
#
#  Every client comes from the files in clients.d/ (FreeRADIUS includes
#  every file of the directory; names starting with "." or ending in "~"
#  are skipped, which the renderer relies on for its temp file):
#
#  - Dev stack: clients.d/dev.conf from the image (one CIDR client read
#    from $ENV{RADIUS_DEV_CLIENT_*}).
#  - Production / pilot (RADIUS_CLIENTS_RENDERED=1): a volume mounted
#    read-only OVER clients.d/ holds `ecloud-nas.conf`, rendered from
#    nas_clients by `node apps/api/dist/radius-clients-cli.js`
#    (docs/SECURITY_REVIEW_P10.md F-P10-07): one `client` per NAS, exact
#    /32 or /128 ipaddr, per-NAS secret, shortname = nas_clients.id,
#    require_message_authenticator from nas_clients. The entrypoint checks
#    that the file is present and that the dev file is not.
#
#  FreeRADIUS 3.2 reads clients at start-up only: SIGHUP re-reads modules
#  but NOT clients (verified on this image, see infra/freeradius/README.md),
#  so a re-rendered file needs a container restart.
#
#  BlastRADIUS (CVE-2024-3596, AAA_ARCHITECTURE.md §8): the global defaults
#  in radiusd.conf are already `require_message_authenticator = yes` and
#  `limit_proxy_state = auto`; every client repeats its value explicitly.
#
######################################################################

#  Phase 2A: admit a NAS without restarting FreeRADIUS. A packet from an
#  address in this network that is not already a known client is looked up
#  through the `ecloud_dynamic_clients` virtual server
#  (sites-available/ecloud-dynamic-clients), which asks the API.
#
#  Static /32 clients from clients.d/ still win: FreeRADIUS matches the most
#  specific network first, so the rendered file remains authoritative for
#  every NAS it contains, and this only covers addresses it does not.
#
#  Default RADIUS_DYNAMIC_CLIENT_SUBNET is TEST-NET-2 (198.51.100.0/24), i.e.
#  effectively off: no real traffic comes from there. Point it at the AP
#  subnet to enable. A /32 is rejected by the server -- it must be a network.
client ecloud_dynamic {
	ipaddr = $ENV{RADIUS_DYNAMIC_CLIENT_SUBNET}
	dynamic_clients = ecloud_dynamic_clients
	lifetime = $ENV{RADIUS_DYNAMIC_CLIENT_LIFETIME}
}

$INCLUDE clients.d/
