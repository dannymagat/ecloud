# -*- text -*-
######################################################################
#
#  ECLOUD dev client -- DEV STACK ONLY (included by ../clients.conf).
#
#  Dev stack (infra/compose/docker-compose.dev.yml): a single client covering
#  the Docker network the compose stack runs on. Packets from the developer
#  host arrive through the published 127.0.0.1:1812/1813 ports with the
#  Docker bridge gateway as source address, so they match this CIDR too.
#  Values come from the container environment ($ENV{...}, radiusd.conf
#  "ENVIRONMENT VARIABLES"); the entrypoint refuses to start when unset.
#
#  Production never sees this file: the rendered-clients volume is mounted
#  over the whole clients.d/ directory (RADIUS_CLIENTS_RENDERED=1), and the
#  entrypoint refuses to start in that mode if this file is still visible.
#
######################################################################

client ecloud_dev {
	ipaddr		= $ENV{RADIUS_DEV_CLIENT_CIDR}
	secret		= $ENV{RADIUS_DEV_CLIENT_SECRET}
	shortname	= ecloud-dev
	nas_type	= other

	require_message_authenticator = yes
	limit_proxy_state = auto
}
