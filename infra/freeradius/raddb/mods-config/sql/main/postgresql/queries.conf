# -*- text -*-
######################################################################
#
#  ECLOUD PostgreSQL queries -- INSERT-ONLY accounting into
#  radius.radacct_raw (AAA_ARCHITECTURE.md §5.2; DATABASE_DESIGN.md §4.2).
#
#  Replaces the stock main/postgresql/queries.conf, whose per-status-type
#  lists UPDATE a mutable radacct row. Here EVERY Acct-Status-Type runs ONE
#  INSERT ... ON CONFLICT DO NOTHING (no UPDATE, no DELETE anywhere in this
#  file); the session view (sessions / accounting_records / usage_counters)
#  is built by the ECLOUD worker "acct-drainer", not by FreeRADIUS.
#
#  Table contract: packages/db/migrations/009_radius_schema.sql
#  (radius.radacct_raw, role ecloud_radius INSERT-only via 010). Column
#  names, NOT NULL constraints and the status-type CHECK below follow that
#  migration exactly; change both together.
#
#  Idempotency: unique index uq_radacct_raw_packet
#    (acctuniqueid, acctstatustype, coalesce(acctsessiontime,0),
#     coalesce(acctinputoctets,0), coalesce(acctoutputoctets,0))
#  -> a NAS retransmit of the same packet is a no-op; a new Interim differs
#  in Acct-Session-Time / octets.
#
#  Gigawords are folded as in the stock file (l.519-522):
#    (Gigawords::bigint << 32) + Octets.
#  Event time: Event-Timestamp when the NAS sends one, else receive time
#  (stock l.54-59); received_at comes from the table default (now()).
#
######################################################################

#  Username exactly as the NAS sent it (no realm stripping on the wire, AAA §7).
sql_user_name = "%{User-Name}"

event_timestamp_epoch = "%{%{integer:Event-Timestamp}:-%l}"
event_timestamp = "TO_TIMESTAMP(${event_timestamp_epoch})"

#######################################################################
#  Accounting
#######################################################################
accounting {
	reference = "%{tolower:type.%{%{Acct-Status-Type}:-%{Request-Processing-Stage}}.query}"

	#
	#  Columns/values shared by every packet type. nasipaddress is NOT NULL
	#  in the migration: a NAS that omits NAS-IP-Address falls back to the
	#  UDP source address (which is the real client identity, AAA §3).
	#
	common_columns = "\
		acctstatustype, \
		acctsessionid, \
		acctuniqueid, \
		username, \
		realm, \
		nasipaddress, \
		nasidentifier, \
		nasportid, \
		nasporttype, \
		acctsessiontime, \
		acctauthentic, \
		acctinputoctets, \
		acctoutputoctets, \
		calledstationid, \
		callingstationid, \
		acctterminatecause, \
		servicetype, \
		framedprotocol, \
		framedipaddress, \
		framedipv6address, \
		framedipv6prefix, \
		framedinterfaceid, \
		delegatedipv6prefix, \
		class, \
		acctdelaytime, \
		eventtimestamp"

	common_values = "\
		'%{Acct-Status-Type}', \
		'%{Acct-Session-Id}', \
		'%{Acct-Unique-Session-Id}', \
		NULLIF('%{SQL-User-Name}', ''), \
		NULLIF('%{Realm}', ''), \
		'%{%{NAS-IPv6-Address}:-%{%{NAS-IP-Address}:-%{%{Packet-Src-IP-Address}:-%{Packet-Src-IPv6-Address}}}}'::inet, \
		NULLIF('%{NAS-Identifier}', ''), \
		NULLIF('%{%{NAS-Port-ID}:-%{NAS-Port}}', ''), \
		NULLIF('%{NAS-Port-Type}', ''), \
		NULLIF('%{Acct-Session-Time}', '')::bigint, \
		NULLIF('%{Acct-Authentic}', ''), \
		(('%{%{Acct-Input-Gigawords}:-0}'::bigint << 32) + '%{%{Acct-Input-Octets}:-0}'::bigint), \
		(('%{%{Acct-Output-Gigawords}:-0}'::bigint << 32) + '%{%{Acct-Output-Octets}:-0}'::bigint), \
		NULLIF('%{Called-Station-Id}', ''), \
		NULLIF('%{Calling-Station-Id}', ''), \
		NULLIF('%{Acct-Terminate-Cause}', ''), \
		NULLIF('%{Service-Type}', ''), \
		NULLIF('%{Framed-Protocol}', ''), \
		NULLIF('%{Framed-IP-Address}', '')::inet, \
		NULLIF('%{Framed-IPv6-Address}', '')::inet, \
		NULLIF('%{Framed-IPv6-Prefix}', '')::inet, \
		NULLIF('%{Framed-Interface-Id}', ''), \
		NULLIF('%{Delegated-IPv6-Prefix}', '')::inet, \
		NULLIF('%{Class}', ''), \
		NULLIF('%{Acct-Delay-Time}', '')::integer, \
		${..event_timestamp}"

	type {
		start {
			query = "\
				INSERT INTO ${....acct_table1} \
					(${...common_columns}, acctstarttime, connectinfo_start) \
				VALUES (${...common_values}, ${....event_timestamp}, NULLIF('%{Connect-Info}', '')) \
				ON CONFLICT DO NOTHING"
		}

		interim-update {
			query = "\
				INSERT INTO ${....acct_table1} \
					(${...common_columns}, acctupdatetime) \
				VALUES (${...common_values}, ${....event_timestamp}) \
				ON CONFLICT DO NOTHING"
		}

		stop {
			query = "\
				INSERT INTO ${....acct_table1} \
					(${...common_columns}, acctupdatetime, acctstoptime, connectinfo_stop) \
				VALUES (${...common_values}, ${....event_timestamp}, ${....event_timestamp}, NULLIF('%{Connect-Info}', '')) \
				ON CONFLICT DO NOTHING"
		}

		#  Accounting-On/Off become rows as well (no bulk UPDATE of open
		#  sessions here); the drainer closes that NAS's sessions (AAA §5.3).
		accounting-on {
			query = "\
				INSERT INTO ${....acct_table1} \
					(${...common_columns}) \
				VALUES (${...common_values}) \
				ON CONFLICT DO NOTHING"
		}

		accounting-off {
			query = "${..accounting-on.query}"
		}
	}
}
